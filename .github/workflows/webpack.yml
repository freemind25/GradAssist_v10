name: GradeAssist CI

# Vérifications exécutées sur chaque push vers main et sur chaque PR.
# Objectif : empêcher qu'un code qui ne compile pas, ou qui casse les types,
# atteigne main — c'est la cause directe de la série de correctifs
# « écran blanc » de septembre 2026.

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

# Le workflow ne fait que lire le dépôt : aucun droit d'écriture nécessaire.
permissions:
  contents: read

# Un nouveau push annule la vérification précédente devenue obsolète :
# économise des minutes et évite deux runs concurrents sur la même branche.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  NEXT_TELEMETRY_DISABLED: "1"

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20.18.0'
          # Le cache npm est indexé sur package-lock.json : les installations
          # suivantes passent de plusieurs minutes à quelques secondes.
          cache: 'npm'

      # npm ci (et non npm install) : installe exactement le lockfile et
      # échoue si package.json et package-lock.json divergent, au lieu de
      # résoudre silencieusement une version différente à chaque run.
      # Le binaire Cypress (~250 Mo) n'est pas nécessaire ici : l'étape E2E
      # l'installe pour elle-même.
      - name: Install dependencies
        run: npm ci --legacy-peer-deps --no-audit --no-fund
        env:
          CYPRESS_INSTALL_BINARY: "0"

      - name: Type check
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build

  # Parcours critique réellement exécuté dans un navigateur.
  # La suite précédente avait dérivé au point de décrire une interface
  # disparue : elle n'a jamais tourné et ne protégeait donc rien.
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20.18.0'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci --legacy-peer-deps --no-audit --no-fund
        env:
          CYPRESS_INSTALL_BINARY: "0"

      # Le binaire est téléchargé explicitement : l'étape suivante ne fait
      # que démarrer l'application et lancer les tests.
      - name: Install Cypress
        run: npx cypress install

      # Le serveur est démarré et attendu ici plutôt que via l'option
      # `wait-on` de cypress-io/github-action : sur les runners actuels
      # (Node 24), son ping interne échoue immédiatement avec
      # ERR_SOCKET_CLOSED_BEFORE_CONNECTION au lieu d'attendre que le
      # serveur écoute. Une boucle curl fait la même chose sans ce défaut.
      - name: Build
        run: npm run build

      - name: Start server and run smoke tests
        run: |
          set -euo pipefail
          npm run start > /tmp/next-start.log 2>&1 &
          SERVER_PID=$!
          trap 'kill "$SERVER_PID" 2>/dev/null || true' EXIT

          ready=""
          for _ in $(seq 1 120); do
            if curl -sf -o /dev/null http://127.0.0.1:3000/; then
              ready="yes"
              break
            fi
            if ! kill -0 "$SERVER_PID" 2>/dev/null; then
              echo "Le serveur s'est arrêté avant d'être prêt."
              cat /tmp/next-start.log
              exit 1
            fi
            sleep 1
          done
          if [ -z "$ready" ]; then
            echo "Le serveur n'a pas répondu dans les 120 secondes."
            cat /tmp/next-start.log
            exit 1
          fi

          if ! npx cypress run --spec cypress/e2e/00-smoke.cy.ts; then
            echo "--- Journal du serveur ---"
            cat /tmp/next-start.log
            exit 1
          fi
        env:
          CYPRESS_BASE_URL: http://127.0.0.1:3000

      - name: Upload screenshots on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: cypress-screenshots
          path: cypress/screenshots
          if-no-files-found: ignore
